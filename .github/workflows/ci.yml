# CI: lint, types, audit, tests, secret scan, image build + scan. Free GitHub features only; no secrets, no access
# to the server or tailnet. Docs-only changes skip the heavy jobs inside the workflow (never via trigger path
# filters), so the single required check `ci-success` always reports.
name: CI

on:
  pull_request:
  push:
    branches: ['build/**']
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/build/') }}

env:
  NODE_VERSION: '24.22.1'
  NEXT_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  TRIVY_VERSION: '0.76.1'
  TRIVY_SHA256: 'c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0'
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Detect code changes (anything outside docs/ and Markdown)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; elif [ "$EVENT" = "push" ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: npm audit (fail on critical)
        run: npm audit --audit-level=critical
      - name: actionlint (checksum-pinned binary)
        run: |
          set -euo pipefail
          curl -sSfL -o al.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  al.tgz" | sha256sum -c -
          tar -xzf al.tgz actionlint
          ./actionlint -color

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      mongo:
        image: mongo:7.0.45-jammy@sha256:7fba8c37d681a79f22a85d2b06bd5ed121a7973c0a6ca20ed4887bb0a1548ce0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --norc --eval 'db.runCommand({ping:1}).ok'"
          --health-start-period 10s
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_MONGO_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit and integration tests
        run: npx vitest run

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (checksum-pinned binary; full history, or the PR range)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          if [ "$EVENT" = "pull_request" ]; then
            ./gitleaks git --no-banner --redact -v --log-opts="${PR_BASE}..${PR_HEAD}" .
          else
            ./gitleaks git --no-banner --redact -v .
          fi

  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build app image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: finance-tracker:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build backup image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/backup
          platforms: linux/amd64
          load: true
          tags: finance-tracker-backup:ci
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max
      - name: Image size
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep ':ci '
      - name: Smoke test (non-root user, liveness endpoint)
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id finance-tracker:ci -u)" != "0"
          docker run -d --name smoke -e APP_URL=http://localhost:3000 -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e DATA_ENCRYPTION_KEY="$(openssl rand -hex 32)" -e MONGO_URL=mongodb://127.0.0.1:1/x -p 127.0.0.1:3000:3000 finance-tracker:ci
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/api/health
          docker rm -f smoke
      - name: Cache Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Trivy (checksum-pinned binary, fail on CRITICAL)
        run: |
          set -euo pipefail
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
          for img in finance-tracker:ci finance-tracker-backup:ci; do
            ./trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --ignorefile .trivyignore "$img"
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start the stack from the images built above (generated throwaway secrets)
        run: |
          set -euo pipefail
          cp .env.example .env
          setv() { sed -i "s|^$1=.*|$1=$2|" .env; }
          setv IMAGE_NAME finance-tracker
          setv IMAGE_TAG ci
          for k in SESSION_SECRET DATA_ENCRYPTION_KEY MONGO_ROOT_PASSWORD MONGO_APP_PASSWORD RESTIC_PASSWORD; do setv "$k" "$(openssl rand -hex 32)"; done
          docker compose up -d --no-build
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/ready >/dev/null; then break; fi
            sleep 3
          done
          curl -sf http://127.0.0.1:3000/api/ready
          docker compose ps
          test -z "$(docker port finance-mongo-1)"
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Playwright browser (headless shell; the runner image already has Chrome's system libraries)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: npx playwright install --only-shell chromium
      - name: e2e smoke (Playwright against docker compose)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/smoke.spec.ts
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --tail 200

  ci-success:
    needs: [changes, static, test, secrets, image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: All required jobs passed or were skipped
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then echo "A required job failed or was cancelled."; exit 1; fi
          echo "CI passed."
