# Weekly dependency updates; minor and patch grouped, majors one by one (they need a human review).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: Europe/Athens }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: docker
    directories: [/, /docker/backup]
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: Europe/Athens }
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(docker)
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: Europe/Athens }
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(docker)
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: Europe/Athens }
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(ci)
